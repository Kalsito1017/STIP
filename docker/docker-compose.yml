services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sofia_transport
      POSTGRES_USER: stip_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/seed/init.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stip_app -d sofia_transport"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ../docker/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stip.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      DB_CONNECTION_STRING: Host=postgres;Database=sofia_transport;Username=stip_app;Password=${DB_PASSWORD}
      REDIS_CONNECTION: redis:6379
      GTFS_RT_FEED_URL: ${GTFS_RT_FEED_URL}
      GTFS_STATIC_URL: ${GTFS_STATIC_URL}
      ML_SERVICE_URL: http://ml:8000
      ML_INTERNAL_SECRET: ${ML_INTERNAL_SECRET:-}
      POLL_INTERVAL_SECONDS: 15
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      DB_CONNECTION_STRING: Host=postgres;Database=sofia_transport;Username=stip_app;Password=${DB_PASSWORD}
      REDIS_CONNECTION: redis:6379
      GTFS_RT_FEED_URL: ${GTFS_RT_FEED_URL}
      GTFS_STATIC_URL: ${GTFS_STATIC_URL}
      ML_SERVICE_URL: http://ml:8000
      ML_INTERNAL_SECRET: ${ML_INTERNAL_SECRET:-}
      POLL_INTERVAL_SECONDS: 15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml
    environment:
      DB_CONNECTION_STRING: Host=postgres;Database=sofia_transport;Username=stip_app;Password=${DB_PASSWORD}
      ML_INTERNAL_SECRET: ${ML_INTERNAL_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
