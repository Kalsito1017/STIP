# Redis configuration for STIP (Sofia Transport Intelligence Platform)
# Production-ready settings for 256MB container

maxmemory 256mb
maxmemory-policy allkeys-lru

# RDB persistence
save 900 1
save 300 10
save 60 10000

# AOF durability
appendonly yes
appendfsync everysec

# Connection tuning
tcp-keepalive 300
timeout 0
